# Builds the engine to WebAssembly plus the frontend, and publishes the result
# to GitHub Pages. The live site needs no server: queries run in the browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10

      - name: Build engine (WebAssembly)
        run: bash scripts/build-wasm.sh

      - name: Run engine tests under WebAssembly
        run: |
          emcmake cmake -S . -B build-wasm-tests -DCMAKE_BUILD_TYPE=Release -DQUERYLAB_BUILD_TESTS=ON
          cmake --build build-wasm-tests -j"$(nproc)" --target querylab_tests
          node build-wasm-tests/engine/querylab_tests.js

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
